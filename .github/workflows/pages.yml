name: Deploy Web Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pinned, from trunk's current home: jetli/trunk-action's "latest"
      # still resolves through the old thedodd/trunk repo to v0.19.1, which
      # fails on Trunk.toml's [watch] ignore of the not-yet-built dist.
      - name: Install Trunk
        run: |
          curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build wasm
        working-directory: crates/sonido-gui
        # Project Pages serve under /sonido/, so asset URLs must be prefixed.
        run: trunk build --release --public-url /sonido/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/sonido-gui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
