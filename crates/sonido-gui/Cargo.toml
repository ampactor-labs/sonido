[package]
name = "sonido-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Professional GUI for the Sonido DSP framework"

[[bin]]
name = "sonido-gui"
path = "src/main.rs"

[dependencies]
# GUI framework
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }

# Audio (workspace)
cpal.workspace = true
sonido-core = { workspace = true, features = ["std", "tracing"] }
sonido-effects = { workspace = true, features = ["std"] }
sonido-gui-core = { workspace = true }
sonido-registry = { workspace = true, features = ["std"] }
sonido-config = { workspace = true, features = ["std"] }
sonido-graph-dsl = { workspace = true }
sonido-patch = { workspace = true, features = ["std"] }
sonido-platform = { workspace = true, features = ["std"] }
# The pedal guide (`sonido_rigs::guide`) and the factory rigs' names
sonido-rigs = { workspace = true }

# Thread-safety
arc-swap = "1.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# File dialogs
rfd = "0.15"

# Presets
serde.workspace = true
serde_json = { workspace = true }

# Error handling
thiserror.workspace = true

# Tracing
tracing.workspace = true
# log stays for files not yet migrated (file_player.rs) and wasm WebLogger
log = "0.4"
egui-snarl = { version = "0.7.1", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sonido-patch = { workspace = true, features = ["serial"] }
sonido-io = { workspace = true }
clap.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
# PNG encoding for the `--screenshot` capture mode.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.17", features = ["wasm-bindgen"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
# Web Serial (Send to pedal in the browser) needs --cfg=web_sys_unstable_apis,
# set for wasm32 in the root .cargo/config.toml.
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Navigator",
    "Serial",
    "SerialPort",
    "SerialOptions",
    "SerialPortFilter",
    "SerialPortRequestOptions",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }
web-time = "1.1"
hound = { workspace = true }

[lints]
workspace = true

[features]
default = []
