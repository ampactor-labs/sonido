[package]
name = "sonido-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Platform abstraction layer for hardware controllers, GUIs, and MIDI - no_std compatible"
keywords = ["dsp", "audio", "platform", "controller", "no_std"]
categories = ["multimedia::audio", "no-std", "hardware-support"]

[features]
default = ["std"]
std = ["sonido-core/std"]

[dependencies]
sonido-core = { workspace = true }
libm = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Test-only: builds real effects to calibrate the knob mapping
# (`tests/knob_calibration.rs`). The registry does not depend on this crate.
sonido-registry = { workspace = true, features = ["std"] }
sonido-analysis = { workspace = true }
