[package]
name = "sonido-gui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared GUI widgets, theme, and parameter bridge for Sonido"

[dependencies]
# GUI framework
egui = { workspace = true }

# Core types (ParamDescriptor, ParamUnit)
sonido-core = { workspace = true, features = ["std"] }
# Effect catalog (names, categories) for family accents and display names
sonido-registry = { workspace = true, features = ["std"] }
# The rig's controls (macro and toggle counts, T1/T3) for the mapping menu
sonido-patch = { workspace = true, features = ["std"] }

[lints]
workspace = true
