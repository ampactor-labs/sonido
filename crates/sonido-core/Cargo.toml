[package]
name = "sonido-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core DSP primitives for sonido - no_std compatible"
keywords = ["dsp", "audio", "effects", "no_std"]
categories = ["multimedia::audio", "no-std"]

[features]
default = ["std"]
std = ["serde?/std"]
spectral = ["std", "dep:rustfft"]
tracing = ["dep:tracing"]
debug-alloc = ["dep:assert_no_alloc"]
## Derives `serde::{Serialize, Deserialize}` on small public POD types
## (`MorphCurve`, …) so downstream crates (`sonido-patch`) can persist them.
## no_std compatible.
serde = ["dep:serde"]

[dependencies]
libm = { workspace = true }
rustfft = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
assert_no_alloc = { version = "1.1", optional = true }
serde = { version = "1.0", default-features = false, features = [
    "derive",
], optional = true }

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "core_bench"
harness = false

[[bench]]
name = "graph_bench"
harness = false
