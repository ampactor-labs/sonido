[package]
name = "sonido-daisy"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Sonido DSP firmware for Electrosmith Daisy Seed (STM32H750 Cortex-M7)"
publish = false

[build-dependencies]
# Encodes the shared factory rigs into the image (see build.rs).
sonido-rigs = { path = "../sonido-rigs" }
sonido-patch = { path = "../sonido-patch", features = ["std"] }

[features]
## Enables `Adapter`/`DirectPolicy` re-exports, `adc_to_param`, and DSP-dependent library modules.
## Required by the examples that use these modules (graph_audio_test, qspi_test,
## single_reverb, single_delay, single_effect, sonido_pedal — see `required-features` below).
## Not needed for the others (blinky, passthrough, bench_kernels, hothouse_diag, ...).
alloc = []
## Enables `HothousePlatform` (`PlatformController` impl backed by `ControlBuffer`).
## Pulls in `sonido-platform`.
platform = ["alloc", "dep:sonido-platform"]

[dependencies]
sonido-core = { path = "../sonido-core", default-features = false }
sonido-effects = { path = "../sonido-effects", default-features = false }
sonido-platform = { path = "../sonido-platform", default-features = false, optional = true }
sonido-registry = { path = "../sonido-registry", default-features = false }
sonido-patch = { path = "../sonido-patch", default-features = false }
libm = "0.2"
static_cell = "2"

# DMA buffer management (replaces daisy-embassy's internal use)
grounded = "0.2"

# SDRAM controller (AS4C16M32MSA-6 device definition + FMC init sequence)
stm32-fmc = "0.4"

# Embassy async runtime
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-stm32 = { version = "0.5", features = ["stm32h750ib", "defmt", "time-driver-tim5"] }
embassy-usb = "0.5"
embassy-sync = "0.7"

# Cortex-M
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1"

# Logging
defmt = "1.0"
defmt-rtt = "1.1"

# Heap allocator (for alloc-based DSP kernels: delay lines, reverb buffers)
embedded-alloc = "0.6"

# Panic handler
panic-probe = { version = "1.0", features = ["print-defmt"] }

# ── Example feature requirements ─────────────────────────────────────

[[example]]
name = "graph_audio_test"
required-features = ["alloc"]

[[example]]
name = "sonido_pedal"
required-features = ["alloc", "platform"]

[[example]]
name = "qspi_test"
required-features = ["alloc"]


[[example]]
name = "single_reverb"
required-features = ["alloc"]

[[example]]
name = "single_delay"
required-features = ["alloc"]

[[example]]
name = "single_effect"
required-features = ["alloc", "platform"]

[[example]]
name = "convert_passthrough"

[[example]]
name = "simple_gain"

# The crate sits outside the workspace, so the workspace profile doesn't apply.
# Fat LTO and one codegen unit let dead code go across crates: the pedal must
# fit the 480 KB the bootloader copies into AXI SRAM.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = 2

# Size-optimize everything but the per-sample code (kernels, core DSP, libm):
# the HAL, USB, executor, registry constructors and patch runtime run at
# control rate or once. This is what fits all 36 effects in 480 KB.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.sonido-effects]
opt-level = 3

[profile.release.package.sonido-core]
opt-level = 3

[profile.release.package.libm]
opt-level = 3
